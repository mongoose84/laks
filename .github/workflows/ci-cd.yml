################################################################################
# LAKS – CI/CD Pipeline
# Triggers on every push to main.
# Steps: restore → build → test → publish → deploy via FTP.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   FTP_URL              – FTP/FTPS host
#   FTP_USERNAME         – FTP user
#   FTP_PASSWORD         – FTP password
#   FTP_PATH             – Remote deploy folder path
#   DB_CONNECTION_STRING – Full MySQL connection string for production
#   NVE_HYD_API          – Production API value for NveHydApi
################################################################################

name: CI/CD – Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; let push-to-main runs finish (deploy job has its
# own concurrency group to serialize production deployments).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Laks.Web/Laks.Web.csproj'
  PUBLISH_DIR: '${{ github.workspace }}/publish'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ── Build & Test ───────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Laks.slnx

      - name: Build
        run: dotnet build Laks.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Laks.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --results-directory ./test-results
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx

  # ── Publish & Deploy ───────────────────────────────────────────────────────
  deploy:
    name: Publish & Deploy via FTP
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: laks-prod-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-winx86-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-winx86-
            ${{ runner.os }}-nuget-

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime win-x86
          --self-contained true
          --output ${{ env.PUBLISH_DIR }}

      # Inject production connection string into the publish output.
      # The secret is stored in GitHub Secrets and never written to source.
      - name: Write production appsettings override
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          NVE_HYD_API: ${{ secrets.NVE_HYD_API }}
        run: |
          $appSettingsPath = Join-Path "${{ env.PUBLISH_DIR }}" "appsettings.Production.json"
          $cfg = @{
            ConnectionStrings = @{
              Laks = $env:DB_CONNECTION_STRING
            }
            NveHydApi = @{
              ApiKey = $env:NVE_HYD_API
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path $appSettingsPath -Value $cfg

      # Put the site into maintenance mode before replacing DLLs. IIS detects
      # app_offline.htm and shuts down the worker process, releasing file locks.
      # Runs only after a successful build so a broken build never takes the
      # site offline. Retries up to 3 times with exponential back-off.
      - name: Bring site offline (upload app_offline.htm)
        id: bring-offline
        shell: bash
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_URL }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          max_attempts=3
          remote_url="ftp://${FTP_HOST}/${FTP_PATH}/app_offline.htm"
          local_file="Laks.Web/CI-Support/app_offline.htm"

          # If already offline from a previous run, skip upload but still mark
          # site_offline so the bring-online step will clean up afterwards.
          if curl -s --ssl -u "${FTP_USER}:${FTP_PASS}" "${remote_url}" > /dev/null 2>&1; then
            echo "⚠️ app_offline.htm already present; skipping upload."
            echo "site_offline=true" >> "$GITHUB_OUTPUT"
          else
            for i in $(seq 1 $max_attempts); do
              echo "Attempt ${i}: uploading app_offline.htm"
              if curl -v --ssl -u "${FTP_USER}:${FTP_PASS}" \
                  -T "${local_file}" "${remote_url}"; then
                echo "✅ Maintenance mode enabled"
                echo "site_offline=true" >> "$GITHUB_OUTPUT"
                break
              elif [ "$i" -eq "$max_attempts" ]; then
                echo "❌ Failed to enable maintenance mode after ${max_attempts} attempts"
                exit 1
              else
                delay=$((5 * i))
                echo "Upload failed; retrying in ${delay}s..."
                sleep $delay
              fi
            done
          fi

          echo "⏳ Waiting 15 seconds for IIS to release file locks..."
          sleep 15
          echo "✅ Proceeding with deployment"

      - name: Deploy via FTP (attempt 1)
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_URL }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ${{ env.PUBLISH_DIR }}/
          exclude: |
            **/*.map
            **/*.br
            **/*.gz
            appsettings.Development.json
            app_offline.htm
          server-dir: ${{ secrets.FTP_PATH }}

      - name: Deploy via FTP (retry on transient failure)
        if: steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_URL }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ${{ env.PUBLISH_DIR }}/
          exclude: |
            **/*.map
            **/*.br
            **/*.gz
            appsettings.Development.json
            app_offline.htm
          server-dir: ${{ secrets.FTP_PATH }}

      # Runs unconditionally (success or failure) as long as the offline step
      # ran, so the site is never left in maintenance mode due to a deploy error.
      - name: Bring site back online (delete app_offline.htm)
        if: always() && steps.bring-offline.outputs.site_offline == 'true'
        shell: bash
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_URL }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          max_attempts=3
          remote_base="ftp://${FTP_HOST}/${FTP_PATH}"
          delete_succeeded=false

          for i in $(seq 1 $max_attempts); do
            echo "Attempt ${i}: deleting app_offline.htm"
            curl -v --ssl -u "${FTP_USER}:${FTP_PASS}" \
              "${remote_base}" \
              -Q "DELE ${FTP_PATH}/app_offline.htm"
            exit_code=$?

            if [ $exit_code -eq 0 ]; then
              echo "✅ Maintenance mode disabled"
              delete_succeeded=true
              break
            elif [ $exit_code -eq 21 ] || [ $exit_code -eq 78 ]; then
              echo "✅ app_offline.htm not found; site already online (exit ${exit_code})"
              delete_succeeded=true
              break
            elif [ "$i" -eq "$max_attempts" ]; then
              echo "⚠️ Failed to delete app_offline.htm after ${max_attempts} attempts"
            else
              delay=$((5 * i))
              echo "Delete failed (exit ${exit_code}); retrying in ${delay}s..."
              sleep $delay
            fi
          done

          if [ "$delete_succeeded" = false ]; then
            echo "❌ Maintenance mode could not be disabled; site may remain offline"
            exit 1
          fi

          echo "✅ Site is now online"

      - name: Upload publish artifact (rollback snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 14
