################################################################################
# LAKS – CI/CD Pipeline
# Triggers on every push to main.
# Steps: restore → build → test → publish → deploy via FTP.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   FTP_URL              – FTP/FTPS host
#   FTP_USERNAME         – FTP user
#   FTP_PASSWORD         – FTP password
#   FTP_PATH             – Remote deploy folder path
#   DB_CONNECTION_STRING – Full MySQL connection string for production
#   NVE_HYD_API          – Production API value for NveHydApi
################################################################################

name: CI/CD – Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'src/Laks.Web/Laks.Web.csproj'
  PUBLISH_DIR: '${{ github.workspace }}/publish'

jobs:
  # ── Build & Test ───────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Laks.slnx

      - name: Build
        run: dotnet build Laks.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Laks.slnx --no-build --configuration Release --verbosity normal --results-directory ./test-results --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx

  # ── Publish & Deploy ───────────────────────────────────────────────────────
  deploy:
    name: Publish & Deploy via FTP
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: laks-prod-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Laks.slnx --runtime win-x86

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-restore
          --runtime win-x86
          --self-contained true
          --output ${{ env.PUBLISH_DIR }}

      # Inject production connection string into the publish output.
      # The secret is stored in GitHub Secrets and never written to source.
      - name: Write production appsettings override
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          NVE_HYD_API: ${{ secrets.NVE_HYD_API }}
        run: |
          $appSettingsPath = Join-Path "${{ env.PUBLISH_DIR }}" "appsettings.Production.json"
          $cfg = @{
            ConnectionStrings = @{
              Laks = $env:DB_CONNECTION_STRING
            }
            NveHydApi = $env:NVE_HYD_API
          } | ConvertTo-Json -Depth 5
          Set-Content -Path $appSettingsPath -Value $cfg

      - name: Deploy via FTP (attempt 1)
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_URL }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ${{ env.PUBLISH_DIR }}/
          exclude: |
            **/*.map
            **/*.br
            **/*.gz
            appsettings.Development.json
          server-dir: ${{ secrets.FTP_PATH }}

      - name: Deploy via FTP (retry on transient failure)
        if: steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_URL }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ${{ env.PUBLISH_DIR }}/
          exclude: |
            **/*.map
            **/*.br
            **/*.gz
            appsettings.Development.json
          server-dir: ${{ secrets.FTP_PATH }}

      - name: Upload publish artifact (rollback snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 14
