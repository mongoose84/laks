name: PR Unit Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore Laks.slnx

      - name: Build
        run: dotnet build Laks.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Laks.Web.Tests/Laks.Web.Tests.csproj --configuration Release --no-build --verbosity normal
